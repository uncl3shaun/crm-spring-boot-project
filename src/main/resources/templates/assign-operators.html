<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Assign Operators</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="mt-4">Назначить операторов на заявку #<span th:text="${request.id}"></span></h1>
    <p>Клиент: <strong th:text="${request.userName}"></strong></p>

    <div class="row">
        <div class="col-md-6">
            <form th:action="@{/details/{id}/assign(id=${request.id})}" method="post">
                <div class="card">
                    <div class="card-header">
                        Выберите операторов
                    </div>
                    <div class="card-body">
                        <div th:each="operator : ${operators}" class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   th:value="${operator.id}"
                                   th:id_="'operator' + ${operator.id}"
                                   name="operatorIds"> <label class="form-check-label" th:for="'operator' + ${operator.id}"
                                   th:text="${operator.name + ' ' + operator.surname + ' (' + operator.department + ')'}">
                                Operator Name
                            </label>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button type="submit" class="btn btn-primary">Назначить (Assign)</button>
                        <a th:href="@{/details/{id}(id=${request.id})}" class="btn btn-secondary">Отмена</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
